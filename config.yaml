# Agent configuration. Change behaviour here, not in the code.

model:
  provider: gemini                # swappable provider (US-7.2)
  name: gemini-flash-latest       # alias for the current Flash model; pin an exact version once stable
  fallback_name: gemini-flash-lite-latest  # used if the main model fails on Google's side (5xx, timeout)
  ranking_name: gemini-flash-lite-latest   # scoring headlines doesn't need the main model; much faster
  api_key_env: GEMINI_API_KEY     # name of the environment variable holding the key
  max_calls_per_run: 8            # hard cap on model calls per run (G7); 1 draft uses up to 5
  timeout_seconds: 180            # give up on a model call after this long

run:
  drafts_per_run: 1               # start with 1; raise after testing
  max_revisions: 1                # critic sends a draft back at most this many times, then rejects
  spare_candidates: 3             # extra ranked topics to fall back on if a source page can't be read
  lookback_days: 7                # only items published in the last N days (US-1.1 AC2)
  max_items_per_source: 8         # default per source; some sources set their own max_items
  stale_after_days: 21            # warn when a source's newest item is older than this
  max_items_to_rank: 60           # most recent items sent to the ranking step
  output_dir: drafts

  # Each group contributes at most this many items per run, so the pool leans towards
  # sources that suit the audience (decision D18). Groups not listed are uncapped.
  group_caps:
    Labs and vendors: 6        # mostly launches and customer case studies
    Community: 8               # engineer discussion and incident reports
    Analysis: 10               # evidence-based writing on AI in work and society
    Product practice: 8        # how product roles and teams work with AI
    Enterprise: 5              # adoption research for business leaders
    Policy: 4
    Research: 3

# Audience: hiring managers for AI roles, teams adopting AI, and BA and product peers (D18).
# Sources are checked in docs/sources.md before being added here.
sources:
  # Labs and vendors
  - name: OpenAI news
    group: Labs and vendors
    url: https://openai.com/news/rss.xml
    max_items: 5
  - name: Google DeepMind blog
    group: Labs and vendors
    url: https://deepmind.google/blog/feed
  - name: Microsoft Foundry blog
    group: Labs and vendors
    url: https://devblogs.microsoft.com/foundry/feed/

  # Community and pain points
  - name: AI News (smol.ai)
    group: Community
    url: https://news.smol.ai/rss.xml   # quiet since 10 Sep 2026; kept so it's picked up if it resumes
  - name: Hacker News
    group: Community
    type: hn_search                     # free Algolia search API, no key
    min_points: 100                     # only stories the community strongly upvoted
    max_items: 5
    queries: [LLM, AI agent, RAG, OpenAI, Anthropic, Gemini, AI adoption]
  - name: AI Incident Database
    group: Community
    url: https://incidentdatabase.ai/rss.xml
    max_items: 5

  # Analysis: weekly or fortnightly newsletters, so a 14-day window
  - name: One Useful Thing (Ethan Mollick)
    group: Analysis
    url: https://www.oneusefulthing.org/feed
    lookback_days: 14
    stale_after_days: 45
  - name: AI as Normal Technology (Princeton)
    group: Analysis
    url: https://www.normaltech.ai/feed
    lookback_days: 14
    stale_after_days: 45
  - name: Import AI
    group: Analysis
    url: https://jack-clark.net/feed/   # author's own site; substack.com refuses cloud servers (D19)
    lookback_days: 14

  # Product practice
  - name: SVPG (Marty Cagan)
    group: Product practice
    url: https://www.svpg.com/feed/
    lookback_days: 14
    stale_after_days: 45
  - name: The Product Compass
    group: Product practice
    url: https://www.productcompass.pm/feed
    lookback_days: 14

  # Enterprise adoption
  - name: McKinsey Insights (AI only)
    group: Enterprise
    url: https://www.mckinsey.com/insights/rss
    keywords: [AI, agentic, generative, gen AI, artificial intelligence, automation]

  # Policy
  - name: EU AI Act explainers (artificialintelligenceact.eu)
    group: Policy
    url: https://artificialintelligenceact.eu/feed/   # publisher's own site (D19)
    lookback_days: 30                   # in-depth explainers, about monthly
    stale_after_days: 120

  # Research
  - name: Carnegie Mellon ML blog
    group: Research
    url: https://blog.ml.cmu.edu/feed/
    stale_after_days: 90          # posts about once a month
